<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un rinconcito para ti</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hearts">♡ ♥ ♡</div>

    <main class="card">

        <h1>Azdine, tengo unas preguntas para ti...</h1>

        <p class="subtitle">
            Pero tienes que responder con sinceridad. ♡
        </p>

        <p id="progress">Pregunta 1 de 10</p>

        <h2 id="question">
            ¿Cuál fue tu primera impresión de mí, y ha cambiado con el tiempo?
        </h2>

        <textarea
            id="answer"
            placeholder="Escribe tu respuesta aquí..."
        ></textarea>

        <button id="nextButton">Siguiente ♡</button>

    </main>

    <script src="script.js"></script>

</body>
</html>
